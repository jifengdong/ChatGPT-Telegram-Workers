name: Build and Test

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run test
        run: pnpm run test

      - name: Build project
        run: pnpm run build

      - name: Run e2e test
        run: pnpm run test:e2e

      - name: Lint
        run: pnpm run lint

      - name: Check formatting
        run: pnpm run format:check

  browser:
    name: Browser E2E
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter @chatgpt-telegram-workers/test-web run install:browser

      - name: Run browser e2e
        env:
          # 使用 Playwright 自带的 Chromium 而非系统 Chrome
          PW_CHANNEL: ''
        run: pnpm run test:e2e:web
